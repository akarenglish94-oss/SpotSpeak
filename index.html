function seg(name,opts,val){var h='<div class="seg3">';opts.forEach(function(o){h+='<button class="'+(o[0]===val?"on":"")+'" data-'+name+'="'+o[0]+'">'+o[1]+"</button>"});return h+"</div>"}
function overlay(){var b=$("tourBox");
 if(S.welcome){b.innerHTML='<div class="ov"><div class="sheet"><div class="brand" style="margin-bottom:12px">'+LOGO+'Spotspeak</div><div class="big" style="font-size:24px;line-height:1.2">Learn the words of the place you are standing in.</div><div class="pr" style="margin-top:14px"><span>📍 Arrive</span><span style="color:var(--mu);font-weight:500">get the place’s words</span></div><div class="pr"><span>📷 Snap</span><span style="color:var(--mu);font-weight:500">AI names any object</span></div><div class="pr"><span>🎟️ Save</span><span style="color:var(--mu);font-weight:500">learn here, save here</span></div><div class="pr"><span>🌍 Choose</span><span style="color:var(--mu);font-weight:500">8 languages</span></div><div class="row" style="margin-top:16px"><button class="bp" style="flex:1;padding:13px" data-ws="1">Start 30-second demo</button><button style="padding:13px" data-wx="1">Explore</button></div><div class="tag" style="margin-top:10px">Prototype for a class pitch. Prices and offers are examples.</div></div></div>';return}
 if(S.sheet){var h='<div class="ov" data-sc="1"><div class="sheet" id="sht">';
  if(S.sheet.t==="lang"){var w=S.sheet.w;h+='<div class="sheetT"><h3>'+(w==="src"?"I speak":"I want to learn")+'</h3><button class="x2" data-sc="1" aria-label="Close">'+ic("x")+"</button></div>";
   L.forEach(function(l){var on=(w==="src"?S.src:S.tgt)===l.k;h+='<button class="lrow'+(on?" on":"")+'" data-pl="'+w+":"+l.k+'"><span class="nm"><b>'+(l.rt?'<span class="rt">'+l.nat+"</span>":l.nat)+"</b><small>"+l.n+(l.v?"":" · no audio yet")+"</small></span>"+(on?ic("chk"):"")+"</button>"});
   h+='<div class="note">All word lists are prototype data. A native speaker must check every word before launch.</div>'}
  else{h+='<div class="sheetT"><h3>Settings</h3><button class="x2" data-sc="1" aria-label="Close">'+ic("x")+'</button></div><div class="tag" style="margin-top:8px">Menu language (partly translated)</div>'+seg("ui",[["en","English"],["ku","کوردی"]],S.ui)+'<div class="tag" style="margin-top:14px">Theme</div>'+seg("th",[["auto","Auto"],["light","Light"],["dark","Dark"]],S.theme)+'<div class="tag" style="margin-top:14px">Demo</div><div class="row" style="margin-top:6px"><button data-reset="1">Reset points and words</button><button data-ws="1">Replay the 30-sec demo</button></div>'}
  b.innerHTML=h+"</div></div>";return}
 if(S.tour<0){b.innerHTML="";return}
 var d="";for(var i=0;i<TOUR.length;i++)d+='<i class="'+(i<=S.tour?"on":"")+'"></i>';
 b.innerHTML='<div class="tour"><div class="dots">'+d+'</div><div>'+TOUR[S.tour][1]+'</div><div class="row sb" style="margin-top:10px"><button data-tx="1">Skip</button><button class="bp" data-tn="1">'+(S.tour===TOUR.length-1?"Finish":"Next →")+"</button></div></div>"}
function tourGo(i){S.welcome=false;S.sheet=null;S.tour=i;if(i>=0){S.tab=TOUR[i][0];if(i<=2)S.place="airport"}render()}

function render(){head();var m=$("main"),k=S.tab+S.place+S.sub+S.ui+S.src+S.tgt;
 m.innerHTML=S.tab==="learn"?vLearn():S.tab==="snap"?vSnap():S.tab==="play"?vPlay():S.tab==="wallet"?vWallet():vPartners();
 if(S.tab==="partners")calcOut();overlay();
 if(k!==S.key){S.key=k;window.scrollTo(0,0);m.classList.add("an");setTimeout(function(){m.classList.remove("an")},500)}}

var SEL="[data-t],[data-place],[data-say],[data-sayw],[data-learn],[data-pick],[data-sample],[data-snapsay],[data-save],[data-sub],[data-qa],[data-qn],[data-qre],[data-hs],[data-hp],[data-hd],[data-hn],[data-rs],[data-rh],[data-rre],[data-rd],[data-boost],[data-tn],[data-tx],[data-ws],[data-wx],[data-lang],[data-swap],[data-pl],[data-sc],[data-ui],[data-th],[data-reset],#bPhoto,#bTour,#bSet";
document.addEventListener("click",function(e){
 if(e.target.classList&&e.target.classList.contains("ov")&&S.sheet){S.sheet=null;render();return}
 var t=e.target.closest(SEL);if(!t)return;
 var D=t.dataset,c=cur();
 if(D.t){S.tab=D.t;render()}
 else if(D.place){S.place=D.place;resetPlay();render()}
 else if(D.ws!=null)tourGo(0);else if(D.wx!=null){S.welcome=false;render()}
 else if(t.id==="bTour")tourGo(0);else if(t.id==="bSet"){S.sheet={t:"set"};render()}
 else if(D.sc!=null){S.sheet=null;render()}
 else if(D.lang){S.sheet={t:"lang",w:D.lang};render()}
 else if(D.swap){var x0=S.src;S.src=S.tgt;S.tgt=x0;sv("ss_src",S.src);sv("ss_tgt",S.tgt);resetPlay();S.rp=null;render()}
 else if(D.pl){var pr=D.pl.split(":"),w0=pr[0],k0=pr[1];if(w0==="src"){if(k0===S.tgt)S.tgt=S.src;S.src=k0}else{if(k0===S.src)S.src=S.tgt;S.tgt=k0}sv("ss_src",S.src);sv("ss_tgt",S.tgt);S.sheet=null;resetPlay();S.rp=null;render()}
 else if(D.ui){S.ui=D.ui;sv("ss_ui",S.ui);render()}
 else if(D.th){S.theme=D.th;sv("ss_theme",S.theme);render()}
 else if(D.reset!=null){S.pts={};S.day={};S.learned={};S.book=[];S.coupons=[];resetPlay();S.rp=null;S.sheet=null;toast("Demo reset");render()}
 else if(D.tn!=null){S.tour>=TOUR.length-1?tourGo(-1):tourGo(S.tour+1)}else if(D.tx!=null)tourGo(-1);
 else if(D.sayw)say(c.w[S.quiz.q[S.quiz.i]]);
 else if(D.say!=null)say(c.w[+D.say]);
 else if(D.learn!=null){var L2=S.learned[S.place]=S.learned[S.place]||[],i=+D.learn;if(L2.indexOf(i)<0){L2.push(i);award(5,"new word")}render()}
 else if(t.id==="bPhoto")$("fileSnap").click();
 else if(D.pick!=null){S.snap.i=+D.pick;render()}
 else if(D.sample!=null){S.snap={img:null,i:+D.sample};render()}
 else if(D.snapsay)say(c.w[S.snap.i]);
 else if(D.save){S.book.push({p:S.place,i:S.snap.i});award(2,"saved a word");render()}
 else if(D.sub){S.sub=D.sub;render()}
 else if(D.qa!=null){var q=S.quiz;if(q.ans)return;var x=c.w[+D.qa];q.ans=x;if(x===c.w[q.q[q.i]]){q.s++;award(5,"correct")}render()}
 else if(D.qn){var q2=S.quiz;q2.ans=null;q2.i++;if(q2.i>=c.w.length)q2.done=true;render()}
 else if(D.qre){qNew();render()}
 else if(D.hs){var H=S.hunt;H.on=true;H.iv=setInterval(function(){H.t--;var el=$("tm");if(el)el.textContent=H.t;if(H.t<=0){clearInterval(H.iv);H.on=false;toast("Time is up!");render()}},1000);render()}
 else if(D.hp!=null){S.hunt.cur=+D.hp;$("fileHunt").click()}
 else if(D.hd!=null)hFound(+D.hd);
 else if(D.hn){if(S.hunt)clearInterval(S.hunt.iv);hNew();render()}
 else if(D.rs){var inp=$("rIn"),v=inp.value.trim();if(!v)return;var R=S.rp,st=RP[R.i],ok=st[1].test(v);R.log.push([st[0],v,ok,st[2]]);if(ok){R.i++;if(R.i>=RP.length){R.done=true;award(10,"role-play done")}}render()}
 else if(D.rh){$("rHint").textContent="Example: “"+RP[S.rp.i][2]+"”"}
 else if(D.rre){S.rp=null;render()}
 else if(D.rd){var n=+D.rd;if(tot()<n)return;var left=n;Object.keys(S.pts).forEach(function(k){var x=Math.min(S.pts[k],left);S.pts[k]-=x;left-=x});
  S.coupons.unshift({o:n===100?"10% off":"15% off + free drink or sweet",v:c.v,c:"SP-"+Math.floor(1000+Math.random()*9000)});toast("Coupon created!");render()}
 else if(D.boost){S.pts[S.place]=(S.pts[S.place]||0)+100;render()}
});
document.addEventListener("change",function(e){var t=e.target;
 if(t.id==="gps"){S.gps=t.checked;render()}
 else if(t.dataset.pcsp){S.pc.sp=t.checked?1:0;calcOut()}
 else if(t.id==="fileSnap"&&t.files[0]){var fr=new FileReader();fr.onload=function(){S.snap={img:fr.result,i:null};t.value="";render()};fr.readAsDataURL(t.files[0])}
 else if(t.id==="fileHunt"&&t.files[0]){t.value="";hFound(S.hunt.cur)}});
document.addEventListener("input",function(e){var t=e.target;if(t.dataset&&t.dataset.pc){S.pc[t.dataset.pc]=+t.value;$("v_"+t.dataset.pc).textContent=t.value;calcOut()}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="rIn"){var b=document.querySelector("[data-rs]");if(b)b.click()}});
render();
</script>
</body>
</html>
